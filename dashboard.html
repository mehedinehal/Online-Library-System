<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Online Library</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-bg">
    <nav>
        <h2>Library Dashboard</h2>
        <div class="user-nav">
            <span id="user-email-display" class="user-email">Loading...</span>
            <button id="logout-btn" class="btn-logout">Logout</button>
        </div>
    </nav>

    <main class="dashboard-container">
        <!-- Add New Book Section -->
        <section class="dashboard-card form-section">
            <h3 class="section-title">Add New Book</h3>
            <form id="add-book-form" class="dashboard-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="book-title">Title</label>
                        <input type="text" id="book-title" placeholder="Enter book title" required>
                    </div>
                    <div class="form-group">
                        <label for="book-author">Author</label>
                        <input type="text" id="book-author" placeholder="Enter author name" required>
                    </div>
                    <div class="form-group">
                        <label for="book-genre">Genre</label>
                        <input type="text" id="book-genre" placeholder="Enter genre (e.g. Fiction, Tech)" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-add">Add Book</button>
            </form>
        </section>

        <!-- Book List Section -->
        <section class="dashboard-card list-section">
            <div class="list-header">
                <h3 class="section-title">Book Collection</h3>
            </div>

            <!-- Full Width Centered Large Search Bar -->
            <div class="search-container">
                <input type="text" id="search-input" class="search-input-lg" placeholder="🔍 Search books by title, author, or genre...">
            </div>

            <div class="table-wrapper">
                <table class="book-table">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Author</th>
                            <th>Genre</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="book-list">
                        <!-- Book items will be loaded dynamically by books.js -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script type="module" src="js/books.js"></script>
</body>
</html>
