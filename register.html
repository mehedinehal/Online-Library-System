<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Online Library</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="register-bg">
    <nav>
        <h2>Online Library</h2>
        <div>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </div>
    </nav>

    <div class="auth-container register-theme">
        <h2>Create Account</h2>
        <p class="auth-sub">Join the digital library portal today</p>
        <form id="register-form">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="reg-email" placeholder="student@university.edu" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="reg-password" placeholder="Min. 6 characters" required>
            </div>
            <button type="submit" class="btn btn-register">Create Account</button>
        </form>
    </div>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
