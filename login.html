<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Online Library</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-bg">
    <nav>
        <h2>Online Library</h2>
        <div>
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
        </div>
    </nav>

    <div class="auth-container login-theme">
        <h2 class="auth-title">User Login Portal</h2>
        <p class="auth-sub">Enter your credentials to access the library system</p>
        <form id="login-form">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="login-email" placeholder="student@university.edu" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-login">Login to Portal</button>
        </form>
    </div>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
